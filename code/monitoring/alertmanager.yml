global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'webhook_cicd'

receivers:
  - name: 'webhook_cicd'
    webhook_configs:
      # This webhook simulates triggering CI/CD pipeline (Task 5 integration)
      # In production, this would call GitHub Actions repository_dispatch API
      - url: 'http://inference_api:8001/webhook'
        send_resolved: true
