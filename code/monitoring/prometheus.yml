global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules file
rule_files:
  - /etc/prometheus/alert_rules.yml

# Alertmanager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Inference API metrics
  - job_name: "inference_api"
    metrics_path: "/metrics/"
    static_configs:
      - targets: ["inference_api:8001"]

  # Standalone metrics exporter (Task 6)
  - job_name: "metrics_exporter"
    metrics_path: "/"
    static_configs:
      - targets: ["metrics_exporter:8000"]
