networks:
  fraud-net:
    name: code_fraud-net
    driver: bridge

services:
  # ---- MLflow Tracking Server ----
  mlflow_server:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    hostname: mlflow_server

    ports:
      - "5000:5000"

    volumes:
      - mlflow_data:/mlflow

    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=*

    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --serve-artifacts

    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((\"localhost\", 5000))'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    networks:
      fraud-net:
        aliases:
          - mlflow_server

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ---- Pipeline Runner ----
  pipeline_runner:
    build: .
    container_name: pipeline_runner

    depends_on:
      mlflow_server:
        condition: service_healthy

    environment:
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
      - PYTHONUNBUFFERED=1

    volumes:
      - ./src:/app/src
      - ../Data:/app/Data
      - ./run_pipeline.py:/app/run_pipeline.py
      - mlflow_data:/mlflow

    command: python run_pipeline.py

    networks:
      - fraud-net

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ---- Inference API ----
  inference_api:
    build: .
    container_name: inference_api

    depends_on:
      mlflow_server:
        condition: service_healthy

    ports:
      - "8001:8001"

    volumes:
      - ./src:/app/src
      - ../Data:/app/Data
      - mlflow_data:/mlflow

    environment:
      - MLFLOW_TRACKING_URI=http://mlflow_server:5000
      - GITHUB_TOKEN=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
      - PYTHONUNBUFFERED=1

    command: uvicorn src.app:app --host 0.0.0.0 --port 8001

    networks:
      - fraud-net

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # ---- Metrics Exporter (Task 6 Standalone Exporter) ----
  metrics_exporter:
    build: .
    container_name: metrics_exporter
    depends_on:
      - pipeline_runner
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ../Data:/app/Data
    environment:
      - PYTHONUNBUFFERED=1
    command: python src/monitor_metrics.py
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml

    networks:
      - fraud-net

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ---- Alertmanager ----
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager

    ports:
      - "9093:9093"

    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml

    networks:
      - fraud-net

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    ports:
      - "3000:3000"

    user: root
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana

    networks:
      - fraud-net

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  grafana_data:
  mlflow_data: